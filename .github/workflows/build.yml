name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: build on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install SDL2 headers (needed by the shim)
        run: brew install sdl2

      - name: Build everything
        run: make

      # `make shim` already asserts the export count, but pin it here too so a
      # regression fails loudly in CI rather than at someone's wheel.
      - name: Verify the shim exports the full SDL surface Wine dlsyms
        run: |
          count=$(nm -gU bin/libSDL2-2.0.0.dylib | grep -c " T _SDL_")
          echo "exported SDL symbols: $count"
          test "$count" -eq 52

      - name: Verify the shim is x86_64 (Wine runs under Rosetta)
        run: |
          file bin/libSDL2-2.0.0.dylib | tee /dev/stderr | grep -q "x86_64"

      - name: Probe runs (no wheel attached on CI — exit 2 is expected)
        run: ./bin/ffb-probe || test $? -eq 2

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck -S warning scripts/*.sh || true
